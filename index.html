<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rayvox Dating ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #12001f, #4b0b52, #ff2f68);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 70px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.5;
      opacity: 0.9;
      margin-bottom: 35px;
    }

    .card {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      padding: 30px 22px;
      backdrop-filter: blur(12px);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 17px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #d41455;
    }

    button:active {
      transform: scale(0.98);
    }

    .small {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">❤️</div>

    <div class="card">
      <h1>Rayvox Dating</h1>

      <p class="subtitle">
        Meet people.<br>
        Find your vibe.<br>
        Make a connection. 💕
      </p>

      <button onclick="startApp()">
        Create My Profile
      </button>

      <p class="small">
        18+ only • Please respect other users
      </p>
    </div>

  </div>

  <script>
    function startApp() {
      alert("Welcome to Rayvox Dating ❤️\n\nProfile creation will be added next!");
    }
  </script>

</body>
  </html>
